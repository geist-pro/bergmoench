[package]
name = "kartei-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "C interface to Anki's Rust backend for the Kartei iOS and Android apps"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anki = { path = "../../spike/anki/rslib" }
anki_proto = { path = "../../spike/anki/rslib/proto" }
# Anki uses tokio::io helpers but only gets this feature through its own workspace.
tokio = { version = "1", features = ["io-util"] }
prost = "0.14"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
anki_proto_gen = { path = "../../spike/anki/rslib/proto_gen" }
prost-reflect = "0.16.5"

[workspace]
